name: Update snapshots
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
permissions:
  contents: write
jobs:
  update-snapshots:
    if: github.ref_name != 'main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[update-snapshots]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/visual_science.spec.js --project=chromium --project="Mobile Safari" --update-snapshots
      - name: Commit wzorców
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual_science.spec.js-snapshots/*-linux.png
          if git diff --cached --quiet; then echo "Brak zmian we wzorcach"; exit 0; fi
          git commit -m "test: zaktualizuj wzorce zrzutów ekranu (Linux, CI)"
          git push origin HEAD:${{ github.ref_name }}
